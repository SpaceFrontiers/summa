default_install_hook_types: [pre-commit, pre-push]

repos:
  # Rust formatting and portable linting
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: clippy-metal
        name: clippy (Metal)
        entry: cargo clippy -p hermes-llm -p hermes-train --all-targets --features metal -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]
      - id: clippy-cuda
        name: clippy (CUDA)
        entry: cargo clippy -p hermes-llm -p hermes-train --all-targets --features cuda -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        exclude: "pnpm-lock.yaml"
