[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "summa-client-python"
version = "2.0.0"
description = "Async Python client for Summa search server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "izihawa" }
]
keywords = ["search", "full-text-search", "grpc", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "grpcio>=1.76.0",
    "protobuf>=6.33.4",
]

[project.urls]
Homepage = "https://github.com/SpaceFrontiers/summa"
Repository = "https://github.com/SpaceFrontiers/summa"

[dependency-groups]
dev = [
    "grpcio-tools>=1.76.0",
    "ruff==0.16.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/summa_client_python"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]
