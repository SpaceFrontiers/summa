[package]
name = "hermes-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core async search engine library with WASM support"

[dependencies]
tokio = { workspace = true, optional = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
byteorder = { workspace = true }
zstd = { workspace = true }
rustc-hash = { workspace = true }
parking_lot = { workspace = true }
arc-swap = "1"
async-channel = { workspace = true, optional = true }
num_cpus = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
log = "0.4"
rust-stemmers = { workspace = true }
stop-words = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
metrics = { version = "0.24", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
instant = { version = "0.1", features = ["wasm-bindgen"], optional = true }
lasso = { workspace = true, optional = true }
hashbrown = { workspace = true }
half = { version = "2.7", features = ["std"] }
fst = { version = "0.4", optional = true }
bincode = { version = "2.0", features = ["serde"] }
memmap2 = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
uuid = { workspace = true, optional = true }
kentro = { version = "0.2", optional = true }
ndarray = { version = "0.16", optional = true }
nalgebra = { version = "0.35", optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"], optional = true }

# Native tokenizers with onig (C library) for full regex support
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokenizers]
version = "0.22"
default-features = false
features = ["onig", "http"]
optional = true

# WASM tokenizers with fancy-regex (pure Rust, no C dependencies)
[target.'cfg(target_arch = "wasm32")'.dependencies.tokenizers]
version = "0.22"
default-features = false
features = ["fancy-regex"]
optional = true

# getrandom needs wasm_js backend for WASM (pulled transitively by tokenizers, rand, etc.)
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
metrics-util = "0.20"
tempfile = { workspace = true }
rand = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }


[features]
default = ["sync"]
native = ["fst-index", "dep:tokio", "dep:async-channel", "dep:num_cpus", "dep:rayon", "dep:lasso", "dep:memmap2", "dep:libc", "dep:uuid", "dep:kentro", "dep:ndarray", "dep:nalgebra", "dep:tokenizers", "dep:hf-hub"]
sync = ["native"]
diagnostics = []
metrics = ["dep:metrics"]
fst-index = ["dep:fst"]
wasm = ["fst-index", "dep:tokenizers"]
http = ["dep:reqwest", "dep:instant"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.reqwest]
version = "0.13"
default-features = false
optional = true
