apiVersion: apps/v1
kind: Deployment
metadata:
  name: summa-server
  namespace: summa
  labels:
    app.kubernetes.io/name: summa-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: summa-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summa-server
    spec:
      # Accepted commits drain and publish even after their RPC disconnects.
      # Give large flushes time to finish before Kubernetes forces termination.
      terminationGracePeriodSeconds: 1800
      containers:
        - name: summa-server
          image: ghcr.io/spacefrontiers/summa/summa-server:latest
          imagePullPolicy: Always
          # Kubernetes args replace the image CMD, so keep the executable
          # explicit when supplying server flags below.
          command:
            - "summa-server"
          args:
            - "--addr"
            - "0.0.0.0:50051"
            - "--data-dir"
            - "/data"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: summa-data
