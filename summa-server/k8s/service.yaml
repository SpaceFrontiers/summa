apiVersion: v1
kind: Service
metadata:
  name: summa-server
  namespace: summa
  labels:
    app.kubernetes.io/name: summa-server
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: summa-server
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
