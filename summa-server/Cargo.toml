[package]
name = "summa-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "gRPC search server for Summa"

[[bin]]
name = "summa-server"
path = "src/main.rs"

[[bin]]
name = "serve-index"
path = "src/bin/serve_index.rs"

[[bin]]
name = "test-doc-retrieval"
path = "src/bin/test_doc_retrieval.rs"

[features]
# Opt-in core work counters for benchmark diagnosis; never enabled by default.
query-diagnostics = ["summa-core/query-diagnostics"]

[dependencies]
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
summa-core = { workspace = true, features = ["native", "sync", "metrics", "cjk-dict"] }
tokio = { workspace = true, features = ["macros", "signal"] }
tonic = { workspace = true, features = ["gzip", "zstd"] }
tonic-prost = "0.14"
prost = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = "0.4"
env_logger = "0.11"
clap = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }

[build-dependencies]
summa-proto = { workspace = true }
tonic-build = { workspace = true }
tonic-prost-build = "0.14"

[dev-dependencies]
serde = { workspace = true }
tempfile = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[[example]]
name = "searchbench_http"
path = "examples/searchbench_http/main.rs"

[package.metadata.cargo-machete]
# prost/tonic-prost are used by tonic::include_proto! generated code
ignored = ["prost", "tonic-prost"]
