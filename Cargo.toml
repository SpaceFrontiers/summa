[workspace]
members = [
    "summa-broker",
    "summa-core",
    "summa-llm",
    "summa-mal",
    "summa-mal-python",
    "summa-proto",
    "summa-tokenizer",
    "summa-train",
    "summa-server",
    "summa-tool",
    "summa-wasm",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/SpaceFrontiers/summa"
homepage = "https://github.com/SpaceFrontiers/summa"
documentation = "https://docs.rs/summa-core"
authors = ["izihawa"]
keywords = ["search", "full-text-search", "indexing", "ir"]
categories = ["database", "text-processing"]

# Python bindings

[workspace.dependencies]
# Internal crates
summa-core = { version = "2.0.0", path = "summa-core", default-features = false }
summa-mal = { version = "2.0.0", path = "summa-mal" }
summa-llm = { version = "2.0.0", path = "summa-llm", default-features = false }
summa-tokenizer = { version = "2.0.0", path = "summa-tokenizer" }
summa-proto = { version = "2.0.0", path = "summa-proto" }

# Async runtime
tokio = { version = "1.49", features = ["rt-multi-thread", "sync", "fs", "io-util", "macros"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# Checkpoint JSON carries exact f32/f64 trainer state. The default fast parser
# may round a serialized float by one ULP, changing content-addressed resume
# artifacts after a load/save cycle.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sonic-rs = "0.5"
byteorder = "1.5"
bincode = "2.0"
prost = "0.14"
prost-types = "0.14"

# Compression
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
rust-openzl = "0.1"

# Text processing
rust-stemmers = "1.2"
# NLTK lists (~150-250 words per language) for the routed languages; the
# default ISO lists are far larger and drop content words such as "state".
stop-words = { version = "0.10", features = ["nltk"] }
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
icu_segmenter = { version = "2.3", features = ["compiled_data", "auto"] }
lindera = { version = "6", features = ["embed-unidic", "embed-ko-dic"] }

# Collections and utilities
rustc-hash = "2.1"
# SIMD posting codec; Cargo.lock pins the resolved 0.9.x release.
bitpacking = { version = "0.9", default-features = false, features = ["bitpacker4x"] }
parking_lot = "0.12"
async-channel = "2.3"
num_cpus = "1.17"
rayon = "1.11"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Parsing
pest = "2.8"
pest_derive = "2.8"
regex = "1.12"
regex-syntax = "0.8.11"

# Encoding
base64 = "0.22"

# gRPC
tonic = "0.14"
tonic-build = "0.14"

# CLI
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module"] }

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Response", "Headers", "Request", "RequestInit", "RequestMode"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Testing
tempfile = "3.24"
rand = "0.9"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# High-performance data structures
lasso = { version = "0.7", features = ["multi-threaded"] }
hashbrown = "0.17"
memmap2 = "0.9"
uuid = { version = "1.19", features = ["v4"] }
