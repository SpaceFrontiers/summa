<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>summa-k8s-manager</title>
<link rel="icon" href="data:,">
<style>
  [hidden] { display: none !important; }
  :root {
    --fg: #1c1f23; --muted: #646b75; --line: #dde1e6; --bg: #fff; --panel: #f6f7f9;
    --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --accent: #0b5cad;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e8eb; --muted: #9aa2ad; --line: #30363d; --bg: #0f1216; --panel: #161b22;
            --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff; }
  }
  body { margin: 0; padding: 0 24px 48px; max-width: 1280px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 0 8px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  .spacer { flex: 1; }
  h2 { font-size: 14px; margin: 24px 0 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .muted { color: var(--muted); } .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .dot::before { content: "●"; margin-right: 4px; font-size: 10px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 4px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
  input, select, textarea { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); box-sizing: border-box; width: 100%; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .banner { margin: 12px 0; padding: 8px 12px; border: 1px solid var(--bad); border-radius: 4px; }
  .form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  .form label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  .span2 { grid-column: span 2; } .span4 { grid-column: span 4; }
  .actions { grid-column: span 4; display: flex; gap: 8px; align-items: center; }
  tr.detail > td { background: var(--panel); }
</style>
</head>
<body>
<header>
  <h1>summa-k8s-manager</h1>
  <span id="title" class="muted"></span>
  <span class="spacer"></span>
  <button id="create">Create index</button>
  <button id="reload">Reload</button>
</header>
<div id="errors"></div>
<div id="editor"></div>
<h2>Indexes</h2>
<table id="clusters"></table>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("en-US");
const clone = (v) => JSON.parse(JSON.stringify(v));
let state = null;          // GET /api/clusters
let open = new Set();      // expanded clusters
let editing = null;        // { name, generation?, spec, created }

async function api(method, path, body) {
  const response = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const text = await response.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { json = { error: text }; }
  return { status: response.status, ok: response.ok, json };
}

function banner(messages) { $("errors").innerHTML = messages.map((m) => `<div class="banner">${esc(m)}</div>`).join(""); }

async function load() {
  const result = await api("GET", "/api/clusters");
  if (!result.ok) { banner([result.json?.error ?? `HTTP ${result.status}`]); return; }
  state = result.json;
  banner(state.nodes?.error ? [`nodes: ${state.nodes.error}`] : []);
  $("title").textContent = `namespace ${state.namespace}`;
  renderClusters();
}

const condition = (cluster, type) => (cluster.status?.conditions ?? []).find((c) => c.type === type);
// Matches the operator: the routing is fixed once the index may exist.
const indexCreated = (cluster) => ["Exists", "Creating", "PartiallyCreated"].includes(condition(cluster, "IndexCreated")?.reason);

function renderClusters() {
  const rows = state.clusters.map((c) => {
    const ready = condition(c, "Ready");
    const docs = (c.shards ?? []).reduce((sum, s) => sum + s.numDocs, 0);
    const readiness = ready
      ? `<span class="dot ${ready.status === "True" ? "ok" : "bad"}">${esc(ready.status === "True" ? "Ready" : ready.reason)}</span>`
      : `<span class="dot warn">not reconciled</span>`;
    const main = `<tr>
      <td><button class="link" data-toggle="${esc(c.name)}">${open.has(c.name) ? "▾" : "▸"}</button><b>${esc(c.name)}</b></td>
      <td class="mono">${esc(c.index)}</td>
      <td class="mono">${esc(c.status?.routing ?? "")}</td>
      <td>${readiness}</td>
      <td class="num">${c.shards ? fmt(docs) : `<span class="muted" title="${esc(c.liveError)}">unavailable</span>`}</td>
      <td class="mono">${esc(c.endpoint)}</td>
      <td style="white-space:nowrap"><button class="link" data-edit="${esc(c.name)}">Edit</button><button class="link" data-delete="${esc(c.name)}">Delete</button></td>
    </tr>`;
    return main + (open.has(c.name) ? detail(c) : "");
  }).join("");
  $("clusters").innerHTML = `<tr><th>Cluster</th><th>Index</th><th>Routing</th><th>Status</th><th class="num">Documents</th><th>Endpoint</th><th></th></tr>` +
    (rows || `<tr><td colspan="7" class="muted">No indexes.</td></tr>`);
  document.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => { const n = b.dataset.toggle; open.has(n) ? open.delete(n) : open.add(n); renderClusters(); });
  document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => edit(state.clusters.find((c) => c.name === b.dataset.edit)));
  document.querySelectorAll("[data-delete]").forEach((b) => b.onclick = () => remove(b.dataset.delete));
}

function detail(c) {
  const ready = condition(c, "Ready");
  const live = new Map((c.shards ?? []).map((s) => [s.shard, s]));
  const weights = c.spec.shards.map((s) => s.weight ?? 1);
  const total = weights.reduce((a, b) => a + b, 0);
  const docs = (c.shards ?? []).reduce((sum, s) => sum + s.numDocs, 0);
  const rows = c.spec.shards.map((s, i) => {
    const st = c.status?.shards?.[i];
    const l = live.get(String(i));
    const share = docs && c.spec.shards.length > 1 ? `${(100 * (l?.numDocs ?? 0) / docs).toFixed(1)}% of rows, weight ${(100 * weights[i] / total).toFixed(1)}%` : "";
    return `<tr><td>${i}</td><td>${esc(s.node)}</td><td class="mono">${esc(s.dataPath)}</td>
      <td>${st ? `<span class="dot ${st.ready ? "ok" : "bad"}">${st.ready ? "ready" : "not ready"}</span>` : ""} <span class="muted">${esc(st?.message)}</span></td>
      <td class="num">${l ? fmt(l.numDocs) : "—"}</td><td class="num">${l ? l.numSegments : "—"}</td><td class="muted">${share}</td></tr>`;
  }).join("");
  return `<tr class="detail"><td colspan="7">
    ${ready && ready.status !== "True" ? `<p class="bad">${esc(ready.reason)}: ${esc(ready.message)}</p>` : ""}
    <p class="muted">Shard image <span class="mono">${esc(c.spec.shard.image)}</span> · broker image <span class="mono">${esc(c.spec.broker.image)}</span>
      · broker ${c.status?.broker?.readyReplicas ?? 0}/${c.spec.broker.replicas} ready${c.protected ? " · deletion protected" : ""}</p>
    <table><tr><th>Shard</th><th>Node</th><th>Data</th><th>Pod</th><th class="num">Documents</th><th class="num">Segments</th><th>Balance</th></tr>${rows}</table>
  </td></tr>`;
}

function blankSpec() {
  const template = state.clusters[0]?.spec;
  return {
    shard: template ? clone(template.shard) : { image: "" },
    shards: [{ node: "", dataPath: "" }],
    broker: template ? clone(template.broker) : { image: "", replicas: 1, backendMaxSearches: 16 },
  };
}

function edit(cluster) {
  editing = cluster
    ? { name: cluster.name, generation: cluster.generation, spec: clone(cluster.spec), created: indexCreated(cluster) }
    : { name: "", spec: blankSpec(), created: false };
  renderEditor();
}

function renderEditor(errors = []) {
  if (!editing) { $("editor").innerHTML = ""; return; }
  const { spec, created } = editing;
  const isNew = editing.generation === undefined;
  const nodes = Array.isArray(state.nodes) ? state.nodes : [];
  const nodeOptions = (selected) => [`<option value="">choose a node</option>`].concat(nodes.map((n) =>
    `<option value="${esc(n.name)}" ${n.name === selected ? "selected" : ""}>${esc(n.name)} (${n.ready ? "ready" : "not ready"}, ${esc(n.cpu ?? "?")} CPU, ${esc(n.memory ?? "?")})</option>`)).join("");
  const shardRows = spec.shards.map((s, i) => `<tr>
    <td>${i}</td><td><select data-node="${i}">${nodeOptions(s.node)}</select></td>
    <td><input data-path="${i}" class="mono" value="${esc(s.dataPath)}" placeholder="/data/summa/${esc((editing.name || "index").replaceAll("-", "_"))}"></td>
    <td><input data-weight="${i}" type="number" min="1" value="${esc(s.weight ?? "")}" ${created ? "disabled" : ""} placeholder="1"></td>
    <td><input data-suspended="${i}" type="checkbox" ${s.suspended ? "checked" : ""} style="width:auto"></td>
    <td>${created ? "" : `<button class="link" data-drop="${i}">Remove</button>`}</td></tr>`).join("");
  const fieldErrors = errors.map((e) => `<li><span class="mono">${esc(e.field)}</span>: ${esc(e.message)}</li>`).join("");
  $("editor").innerHTML = `<h2>${isNew ? "Create index" : `Edit ${esc(editing.name)}`}</h2><div class="form">
    <label>Cluster name<input id="e-name" value="${esc(editing.name)}" ${isNew ? "" : "disabled"} placeholder="documents-20261101"></label>
    <label>Index<input id="e-index" disabled value="${esc(editing.name.replaceAll("-", "_"))}"></label>
    <label class="span2">Shard image<input id="e-shard-image" class="mono" value="${esc(spec.shard.image)}"></label>
    <label class="span2">Shard arguments, one per line<textarea id="e-args" rows="6">${esc((spec.shard.args ?? []).join("\n"))}</textarea></label>
    <label class="span2">Schema (SDL)${created ? " — the index exists" : ""}<textarea id="e-schema" rows="6" ${created ? "disabled" : ""}>${esc(spec.schema ?? "")}</textarea></label>
    <div class="span4"><table><tr><th>Shard</th><th>Node</th><th>Data directory</th><th>Weight</th><th>Suspended</th><th></th></tr>${shardRows}</table>
      ${created ? `<p class="muted">Shard count and weights are fixed once the index exists.</p>` : `<button id="e-add">Add shard</button>`}</div>
    <label class="span2">Broker image<input id="e-broker-image" class="mono" value="${esc(spec.broker.image)}"></label>
    <label>Broker replicas<input id="e-replicas" type="number" min="1" value="${esc(spec.broker.replicas ?? 1)}"></label>
    <label>Searches per shard<input id="e-budget" type="number" min="1" value="${esc(spec.broker.backendMaxSearches ?? 16)}"></label>
    ${fieldErrors ? `<div class="span4 bad"><ul>${fieldErrors}</ul></div>` : ""}
    <div class="actions"><button class="primary" id="e-save">${isNew ? "Create" : "Save"}</button><button id="e-cancel">Cancel</button>
      <span class="muted">Other fields (env, resources, tolerations) are kept as they are; edit them with kubectl.</span></div>
  </div>`;
  const sync = () => {
    editing.name = $("e-name").value.trim();
    spec.shard.image = $("e-shard-image").value.trim();
    spec.shard.args = $("e-args").value.split("\n").map((a) => a.trim()).filter(Boolean);
    if (!spec.shard.args.length) delete spec.shard.args;
    if (!created) { const schema = $("e-schema").value; if (schema.trim()) spec.schema = schema; else delete spec.schema; }
    spec.broker.image = $("e-broker-image").value.trim();
    spec.broker.replicas = Number($("e-replicas").value);
    spec.broker.backendMaxSearches = Number($("e-budget").value);
    spec.shards.forEach((s, i) => {
      s.node = document.querySelector(`[data-node="${i}"]`).value;
      s.dataPath = document.querySelector(`[data-path="${i}"]`).value.trim();
      const weight = document.querySelector(`[data-weight="${i}"]`).value;
      if (weight) s.weight = Number(weight); else delete s.weight;
      if (document.querySelector(`[data-suspended="${i}"]`).checked) s.suspended = true; else delete s.suspended;
    });
  };
  $("e-name").oninput = (e) => { $("e-index").value = e.target.value.trim().replaceAll("-", "_"); };
  if ($("e-add")) $("e-add").onclick = () => { sync(); spec.shards.push({ node: "", dataPath: "" }); renderEditor(); };
  document.querySelectorAll("[data-drop]").forEach((b) => b.onclick = () => { sync(); spec.shards.splice(Number(b.dataset.drop), 1); renderEditor(); });
  $("e-cancel").onclick = () => { editing = null; renderEditor(); };
  $("e-save").onclick = async () => {
    sync();
    const result = isNew
      ? await api("POST", "/api/clusters", { name: editing.name, spec })
      : await api("PUT", `/api/clusters/${encodeURIComponent(editing.name)}`, { generation: editing.generation, spec });
    if (result.status === 422) { renderEditor(result.json.errors); return; }
    if (!result.ok) { banner([result.json?.error ?? `HTTP ${result.status}`]); return; }
    open.add(editing.name); editing = null; renderEditor(); await load();
  };
}

async function remove(name) {
  const typed = prompt(`Deleting ${name} removes its shards and broker; the data directories stay on the nodes. Type the cluster name to confirm.`);
  if (typed === null) return;
  const result = await api("DELETE", `/api/clusters/${encodeURIComponent(name)}?confirm=${encodeURIComponent(typed)}`);
  if (!result.ok) { banner([result.json?.error ?? `HTTP ${result.status}`]); return; }
  await load();
}

$("reload").onclick = load;
$("create").onclick = () => edit(null);
load();
</script>
</body>
</html>
