[package]
name = "summa-k8s-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Kubernetes operator and console for SearchCluster resources"
publish = false

[[bin]]
name = "summa-k8s-manager"
path = "src/main.rs"

[dependencies]
summa-broker = { path = "../summa-broker" }
anyhow = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { workspace = true }
env_logger = "0.11"
futures = { workspace = true }
k8s-openapi = { version = "0.25", features = ["latest", "schemars"] }
kube = { version = "1", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
log = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
prost = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "signal", "time"] }
tonic = { workspace = true }
tonic-prost = "0.14"

[build-dependencies]
summa-proto = { workspace = true }
tonic-prost-build = "0.14"

[package.metadata.cargo-machete]
# prost/tonic-prost are used by tonic::include_proto! generated code
ignored = ["prost", "tonic-prost"]
