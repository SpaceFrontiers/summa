name: Documentation and blog

on:
  push:
    branches: [main]
    paths:
      [
        "website/**",
        "docs/**",
        "**/README.md",
        "CONTRIBUTING.md",
        "scripts/build_website.py",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current documentation
        run: python3 scripts/build_website.py
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./.context/website
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
        id: deployment
