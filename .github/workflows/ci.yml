name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Main Rust CI - fmt, clippy, test, build in one job
  rust:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Require official accelerator repositories
        shell: bash
        run: |
          unexpected=$(git grep -nE 'github\.com/[^/]+/(burn|cubecl|cubek)' -- '*Cargo.toml' Cargo.lock \
            | grep -v 'github.com/tracel-ai/' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Accelerator dependencies must use their official repositories:"
            echo "$unexpected"
            exit 1
          fi
          if git grep -nE '^\[patch\..*(burn|cubecl|cubek)' -- '*Cargo.toml'; then
            echo "Use an immutable official-repository dependency revision, not a Cargo patch"
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Hermes Core native-without-sync boundary
        run: cargo check -p hermes-core --no-default-features --features native --all-targets

      - name: CUDA training compile boundary
        run: cargo check -p hermes-train --features cuda --all-targets

      - name: API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: Test
        run: cargo test --workspace

      - name: Broker end-to-end against real hermes-server
        run: |
          cargo build -p hermes-server --bin hermes-server
          cargo test -p hermes-broker --test e2e_real_server -- --ignored

      - name: Validate model-bound training workflows
        run: |
          cargo run -p hermes-train -- validate-workflow \
            --workflow hermes-train/workflow.example.json \
            --config hermes-mal/well-known/retriever_300m_moe.mal >/dev/null
          cargo run -p hermes-train -- validate-workflow \
            --workflow hermes-train/workflow.sleep.example.json \
            --config hermes-mal/well-known/retriever_300m_moe_sleep.mal >/dev/null
          cargo run -p hermes-train -- validate-workflow \
            --workflow hermes-train/workflow.education.example.json \
            --config hermes-mal/well-known/retriever_300m_moe_sleep.mal >/dev/null

      - name: Build
        run: cargo build --workspace --release

  training-supervisor:
    name: Shell and Training Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell scripts and test relaunch supervisor
        run: |
          git ls-files '*.sh' -z | xargs -0 shellcheck -x -e SC1091
          python3 -m py_compile hermes-train/scripts/*.py
          python3 hermes-train/scripts/test_wandb_tail.py
          hermes-train/scripts/relaunch_test.sh

      - name: Check training configuration JSON
        run: |
          for config in \
            hermes-train/workflow.example.json \
            hermes-train/workflow.sleep.example.json \
            hermes-train/workflow.education.example.json \
            hermes-train/sleep-runtime.periodic.example.json \
            hermes-train/sleep-runtime.standalone.example.json \
            hermes-train/corpus.production.example.json \
            hermes-train/curriculum-composition.example.json
          do
            python3 -m json.tool "$config" >/dev/null
          done

  # Security audit - check for known vulnerabilities
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  # Unused dependency check
  machete:
    name: Cargo Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Run cargo machete
        run: cargo machete

  # WASM build - separate due to different target; its output feeds the search UI
  wasm:
    name: WASM and Search Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Install LLVM and wasm-pack
        run: |
          sudo apt-get update && sudo apt-get install -y llvm clang
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: cd hermes-wasm && bash build.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: hermes-wasm/package-lock.json

      - name: Install dependencies
        working-directory: hermes-wasm
        run: npm ci

      - name: Run tests
        working-directory: hermes-wasm
        run: npm test

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install web dependencies
        working-directory: hermes-web
        run: pnpm install --frozen-lockfile

      - name: Check and build web
        working-directory: hermes-web
        run: |
          pnpm run lint
          pnpm test
          pnpm run build

  model-lab:
    name: LLM Model Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify search and Model Lab source ownership
        run: |
          if git grep -n -E 'hermes-web|hermes-wasm' -- hermes-model-lab/src; then
            echo "Model Lab source must not depend on the search UI or WASM package"
            exit 1
          fi
          if git grep -n -E 'model-lab|hermes-model-lab' -- hermes-web/src; then
            echo "Search UI source must not contain Model Lab code"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: hermes-model-lab/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: hermes-model-lab
        run: pnpm install --frozen-lockfile

      - name: Check Model Lab
        working-directory: hermes-model-lab
        run: pnpm check

  # Python lint and unit tests - no native extension compilation
  python:
    name: Python Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Lint and format Python
        run: |
          uv run --locked --project hermes-client-python --group dev ruff check .
          uv run --locked --project hermes-client-python --group dev ruff format --check .
      - name: Check generated Python protocol bindings
        working-directory: hermes-client-python
        run: |
          uv run --locked --group dev python generate_proto.py
          git diff --exit-code -- \
            src/hermes_client_python/hermes_pb2.py \
            src/hermes_client_python/hermes_pb2_grpc.py
      - name: Test Python client helpers
        run: |
          uv run --locked --project hermes-client-python --group test \
            pytest hermes-client-python/tests/test_client_unit.py \
              hermes-client-python/stress_test/test_stress_test.py

  mal-python:
    name: MAL Python Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build \
            --release \
            --manifest-path hermes-mal-python/Cargo.toml \
            --out hermes-mal-python/dist
          python -m pip install hermes-mal-python/dist/*.whl

      - name: Smoke-test the installed extension
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from hermes_mal import parse_mal

          source = Path("hermes-mal/well-known/tiny.mal").read_text()
          model = json.loads(parse_mal(source))
          assert model["vocab_size"] == 32_000
          PY

  # TypeScript client - build check
  typescript:
    name: TypeScript Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: hermes-client-typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: cd hermes-client-typescript && pnpm install --frozen-lockfile

      - name: Generate proto stubs
        working-directory: hermes-client-typescript
        run: |
          pnpm run generate
          git diff --exit-code -- src/generated/hermes.ts

      - name: Build and test
        run: cd hermes-client-typescript && pnpm test
