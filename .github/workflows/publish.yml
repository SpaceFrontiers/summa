name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version already merged into the default branch (blank uses Cargo.toml)"
        type: string
        default: ""
      publish_crates:
        description: "Publish to crates.io"
        type: boolean
        default: true
      publish_npm:
        description: "Publish to NPM"
        type: boolean
        default: true
      publish_pypi:
        description: "Publish to PyPI"
        type: boolean
        default: true
      publish_npm_ts:
        description: "Publish TS client to NPM"
        type: boolean
        default: true
      publish_docker:
        description: "Publish Docker image"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Verify and tag reviewed release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Require the default branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$BASE_BRANCH" ]]; then
            echo "::error::Publish must run from $BASE_BRANCH"
            exit 1
          fi

      - uses: actions/checkout@v4
        # Publish the dispatch snapshot, even if main advances while queued.
        with:
          ref: ${{ github.sha }}

      # Version bumps belong in maintainer PRs. Organization policy forbids
      # Actions-created PRs, and main intentionally rejects direct pushes.
      - name: Verify package versions and tag the reviewed commit
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/publish_version.py "$RELEASE_VERSION"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: prepare-release
    if: inputs.publish_crates
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Login to crates.io
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish summa-proto
        run: cargo publish -p summa-proto --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-core
        run: cargo publish -p summa-core --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-mal
        run: cargo publish -p summa-mal --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-tokenizer
        run: cargo publish -p summa-tokenizer --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-server
        run: cargo publish -p summa-server --no-verify

      - name: Publish summa-broker
        run: cargo publish -p summa-broker --no-verify

      - name: Publish summa-tool
        run: cargo publish -p summa-tool --no-verify

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: prepare-release
    if: inputs.publish_npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build WASM
        run: |
          cd summa-wasm
          bash build.sh

      - name: Publish to NPM
        run: |
          cd summa-wasm/pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-ts:
    name: Publish TS Client to NPM
    runs-on: ubuntu-latest
    needs: prepare-release
    if: inputs.publish_npm_ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: cd summa-client-typescript && pnpm install --frozen-lockfile

      - name: Generate proto stubs
        run: cd summa-client-typescript && pnpm run generate

      - name: Build
        run: cd summa-client-typescript && pnpm run build

      - name: Publish to NPM
        run: cd summa-client-typescript && pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: prepare-release
    if: inputs.publish_pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate proto stubs
        run: |
          cd summa-client-python
          uv sync --locked --group dev
          uv run --locked --group dev python generate_proto.py

      - name: Build package
        run: |
          cd summa-client-python
          uv build

      - name: Publish to PyPI
        run: |
          cd summa-client-python
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-mal-python:
    name: Publish MAL Python package
    runs-on: ubuntu-latest
    needs: prepare-release
    if: inputs.publish_pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: astral-sh/setup-uv@v5
      - name: Build source distribution
        run: uvx --from maturin maturin sdist --manifest-path summa-mal-python/Cargo.toml --out dist
      - name: Publish to PyPI
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: inputs.publish_docker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/summa-server
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare-release.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare-release.outputs.new_version }}
            type=raw,value=latest

      - name: Cache Cargo build data
        id: cargo-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cargo-cache
          key: buildkit-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            buildkit-cargo-${{ runner.os }}-

      - name: Restore Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".buildkit-cargo-cache/registry": {
                "target": "/usr/local/cargo/registry",
                "id": "summa-cargo-registry",
                "sharing": "locked"
              },
              ".buildkit-cargo-cache/git": {
                "target": "/usr/local/cargo/git",
                "id": "summa-cargo-git",
                "sharing": "locked"
              },
              ".buildkit-cargo-cache/target": {
                "target": "/app/target",
                "id": "summa-cargo-target",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Build and push Summa image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=summa-image
          cache-to: type=gha,scope=summa-image,mode=max
