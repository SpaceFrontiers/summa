name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish_crates:
        description: "Publish to crates.io"
        type: boolean
        default: true
      publish_npm:
        description: "Publish to NPM"
        type: boolean
        default: true
      publish_pypi:
        description: "Publish to PyPI"
        type: boolean
        default: true
      publish_npm_ts:
        description: "Publish TS client to NPM"
        type: boolean
        default: true
      publish_docker:
        description: "Publish Docker image"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: bump
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ inputs.version_bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Update Cargo.toml versions
        run: |
          # Update workspace package version
          sed -i 's/^version = ".*"/version = "${{ steps.bump.outputs.new_version }}"/' Cargo.toml
          # Keep every internal requirement aligned with the release.
          sed -i -E '/^summa-.*path = /s/version = "[^"]*"/version = "${{ steps.bump.outputs.new_version }}"/' Cargo.toml
          echo "Updated Cargo.toml to version ${{ steps.bump.outputs.new_version }}"

      - name: Update pyproject.toml versions
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.bump.outputs.new_version }}"/' summa-client-python/pyproject.toml
          sed -i 's/^version = ".*"/version = "${{ steps.bump.outputs.new_version }}"/' summa-mal-python/pyproject.toml
          echo "Updated Python packages to version ${{ steps.bump.outputs.new_version }}"

      - uses: astral-sh/setup-uv@v5

      - name: Update Python client lockfile
        run: uv lock --project summa-client-python

      - name: Update TypeScript client version
        run: |
          cd summa-client-typescript
          sed -i 's/"version": ".*"/"version": "${{ steps.bump.outputs.new_version }}"/' package.json
          echo "Updated package.json to version ${{ steps.bump.outputs.new_version }}"

      - name: Update Cargo.lock
        run: cargo generate-lockfile

      - name: Commit and push
        run: |
          git add Cargo.toml Cargo.lock \
            summa-client-python/pyproject.toml \
            summa-client-python/uv.lock \
            summa-mal-python/pyproject.toml \
            summa-client-typescript/package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push

      - name: Create git tag
        run: |
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: bump-version
    if: inputs.publish_crates
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Login to crates.io
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish summa-proto
        run: cargo publish -p summa-proto --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-core
        run: cargo publish -p summa-core --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-mal
        run: cargo publish -p summa-mal --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-tokenizer
        run: cargo publish -p summa-tokenizer --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish summa-server
        run: cargo publish -p summa-server --no-verify

      - name: Publish summa-broker
        run: cargo publish -p summa-broker --no-verify

      - name: Publish summa-tool
        run: cargo publish -p summa-tool --no-verify

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: bump-version
    if: inputs.publish_npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build WASM
        run: |
          cd summa-wasm
          bash build.sh

      - name: Publish to NPM
        run: |
          cd summa-wasm/pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-ts:
    name: Publish TS Client to NPM
    runs-on: ubuntu-latest
    needs: bump-version
    if: inputs.publish_npm_ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: cd summa-client-typescript && pnpm install --frozen-lockfile

      - name: Generate proto stubs
        run: cd summa-client-typescript && pnpm run generate

      - name: Build
        run: cd summa-client-typescript && pnpm run build

      - name: Publish to NPM
        run: cd summa-client-typescript && pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: bump-version
    if: inputs.publish_pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate proto stubs
        run: |
          cd summa-client-python
          uv sync --locked --group dev
          uv run --locked --group dev python generate_proto.py

      - name: Build package
        run: |
          cd summa-client-python
          uv build

      - name: Publish to PyPI
        run: |
          cd summa-client-python
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-mal-python:
    name: Publish MAL Python package
    runs-on: ubuntu-latest
    needs: bump-version
    if: inputs.publish_pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: astral-sh/setup-uv@v5
      - name: Build source distribution
        run: uvx --from maturin maturin sdist --manifest-path summa-mal-python/Cargo.toml --out dist
      - name: Publish to PyPI
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: bump-version
    if: inputs.publish_docker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/summa-server
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.bump-version.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.bump-version.outputs.new_version }}
            type=raw,value=latest

      - name: Cache Cargo build data
        id: cargo-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cargo-cache
          key: buildkit-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            buildkit-cargo-${{ runner.os }}-

      - name: Restore Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".buildkit-cargo-cache/registry": {
                "target": "/usr/local/cargo/registry",
                "id": "summa-cargo-registry",
                "sharing": "locked"
              },
              ".buildkit-cargo-cache/git": {
                "target": "/usr/local/cargo/git",
                "id": "summa-cargo-git",
                "sharing": "locked"
              },
              ".buildkit-cargo-cache/target": {
                "target": "/app/target",
                "id": "summa-cargo-target",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Build and push Summa image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=summa-image
          cache-to: type=gha,scope=summa-image,mode=max
