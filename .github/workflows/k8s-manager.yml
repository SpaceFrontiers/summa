name: summa-k8s-manager image

# Builds the SearchCluster operator image. Pull requests build and smoke-test
# it; main publishes ghcr.io/<repository>/summa-k8s-manager as `latest` and
# `sha-<commit>`. Run manually to publish another ref.
on:
  push:
    branches: [main]
    paths:
      - "summa-k8s-manager/**"
      - "summa-broker/**"
      - "summa-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/k8s-manager.yml"
  pull_request:
    branches: [main]
    paths:
      - "summa-k8s-manager/**"
      - "summa-broker/**"
      - "summa-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/k8s-manager.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: k8s-manager-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build summa-k8s-manager image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Cargo build data
        id: cargo-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cargo-cache
          key: k8s-manager-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            k8s-manager-cargo-${{ runner.os }}-

      - name: Restore Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".buildkit-cargo-cache/registry": {
                "target": "/usr/local/cargo/registry",
                "id": "summa-k8s-manager-cargo-registry",
                "sharing": "locked"
              },
              ".buildkit-cargo-cache/git": {
                "target": "/usr/local/cargo/git",
                "id": "summa-k8s-manager-cargo-git",
                "sharing": "locked"
              },
              ".buildkit-cargo-cache/target": {
                "target": "/app/target",
                "id": "summa-k8s-manager-cargo-target",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/summa-k8s-manager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: summa-k8s-manager/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=summa-k8s-manager
          cache-to: type=gha,scope=summa-k8s-manager,mode=max

      - name: Smoke test
        # The binary starts, and the CRD it installs is well-formed.
        run: |
          docker run --rm "${{ steps.build.outputs.imageid }}" crd > crd.json
          jq -e '.kind == "CustomResourceDefinition" and .spec.names.kind == "SearchCluster"' crd.json

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: summa-k8s-manager/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=summa-k8s-manager
