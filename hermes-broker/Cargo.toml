[package]
name = "hermes-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "gRPC broker routing across multiple Hermes server instances"

[[bin]]
name = "hermes-broker"
path = "src/main.rs"

[dependencies]
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
tokio = { workspace = true, features = ["macros", "signal", "time"] }
tonic = { workspace = true, features = ["gzip", "zstd"] }
tonic-prost = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
prost = { workspace = true }
anyhow = { workspace = true }
log = "0.4"
env_logger = "0.11"
clap = { workspace = true }
parking_lot = { workspace = true }
num_cpus = { workspace = true }
arc-swap = "1.7"
futures = { workspace = true }
kube = { version = "1", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.25", features = ["latest"] }
# kube's rustls-tls needs a process-level crypto provider selected explicitly
# (rustls 0.23 panics at first TLS use otherwise).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = "0.14"

[package.metadata.cargo-machete]
# prost/tonic-prost are used by tonic::include_proto! generated code
ignored = ["prost", "tonic-prost"]
